# Reusable: build the Rust (Slint) client for Windows, Linux and macOS.
#
#   jobs:
#     build:
#       uses: Nullware-Inc/.github/.github/workflows/rust-app.yml@main
#
# yt-dlp is downloaded at build time by build.rs and embedded in the binary.
name: Rust app

on:
  workflow_call:
    inputs:
      ytdlp-version:
        description: yt-dlp release to embed (default latest)
        type: string
        default: latest

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, bin: nullyt.exe }
          - { os: ubuntu-latest,  name: linux,   bin: nullyt }
          - { os: macos-latest,   name: macos,   bin: nullyt }
    runs-on: ${{ matrix.os }}
    env:
      NULLYT_YTDLP_VERSION: ${{ inputs.ytdlp-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libgtk-3-dev

      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release

      - name: Package
        shell: bash
        run: |
          mkdir dist
          name="NullYT-Rust-${{ matrix.name }}-${GITHUB_REF_NAME//\//-}"
          if [ "${{ matrix.name }}" = windows ]; then
            7z a "dist/$name.zip" ./target/release/${{ matrix.bin }}
          else
            tar -C target/release -czf "dist/$name.tar.gz" ${{ matrix.bin }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nullyt-rust-${{ matrix.name }}
          path: dist/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
